{% extends 'admin_app/admin-dashboard.html' %} {% block content %}
<div
  style="
    max-width: 400px;
    margin: 100px auto;
    padding: 40px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  "
>
  <div style="text-align: center; margin-bottom: 32px">
    <h1
      style="
        font-family: &quot;Syne&quot;, sans-serif;
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--text);
        margin: 0 0 8px 0;
      "
    >
      Portfolio Admin
    </h1>
    <p style="color: var(--muted); margin: 0">
      Sign in to manage your portfolio
    </p>
  </div>
  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 20px">{{ form.username }}</div>
    <div style="margin-bottom: 24px">{{ form.password }}</div>
    {% if form.errors %}
    <div
      style="
        background: #fee;
        border: 1px solid #fcc;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 20px;
        color: #c33;
      "
    >
      {{ form.errors }}
    </div>
    {% endif %}
    <button
      type="submit"
      class="btn btn-primary"
      style="width: 100%; padding: 14px; font-weight: 600"
    >
      Sign In
    </button>
  </form>
  <div
    style="
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--muted);
    "
  >
    Don't have an account?
    <a
      href="#"
      onclick="showToast('Run python manage.py createsuperuser', 'info')"
      >Create superuser</a
    >
  </div>
</div>
{% endblock %}
